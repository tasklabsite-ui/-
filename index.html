
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій перший сайт</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101c30;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 650px; }
    .label { color: #a5b4fc; letter-spacing: 3px; }
    h1 { font-size: 44px; margin-top: 35px; }
    p { color: #cbd5e1; line-height: 1.7; }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px 28px;
      margin: 25px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #6366f1; }
    #message { color: #86efac; font-weight: bold; }
    footer { color: #94a3b8; margin-top: 50px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="label">MY FIRST WEBSITE</div>
    <h1>Привіт, GitHub! 👋</h1>
    <p>Це мій перший вебпроєкт. Я вчуся створювати сайти та працювати з GitHub.</p>
    <button onclick="sayHello()">Натисни мене 🚀</button>
    <p id="message" aria-live="polite"></p>
    <footer>Створено за допомогою HTML, CSS та JavaScript</footer>
  </main>
  <script>
    function sayHello() {
      document.getElementById("message").textContent =
        "Вітаю! Твоя перша кнопка працює! 🎉";
    }
  </script>
</body>
</html>
